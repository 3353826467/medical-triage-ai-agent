version: '3.5'

# Milvus 3.0 standalone（主线版本，2026-07-29 GA）
#   启动：docker compose -f docker/docker-compose.milvus-3.yml up -d
#
# 3.0 的新特性：lake-native（直接在对象存储上建索引，不必把数据搬进 Milvus）、
# StructList 多向量检索、SINDI 稀疏索引。standalone 部署形态与 2.6 完全一致
# （仍是 etcd + MinIO + standalone 三容器），所以只是换镜像版本。
#
# ⚠️ 注意：3.0 GA 时间较短，生产环境建议先用 2.6（docker-compose.milvus.yml）。
# 客户端已装的 pymilvus 是 3.0.2，与 3.0 服务端版本对齐；若改用 2.6 服务端，
# pymilvus 3.0.2 仍可连接（服务端向后兼容），如遇异常再降级 pymilvus==2.6.9。

services:
  etcd:
    container_name: medical-etcd3
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./volumes3/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: medical-minio3
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./volumes3/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: medical-milvus3
    image: milvusdb/milvus:v3.0.2
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./volumes3/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio

  attu:
    container_name: medical-attu3
    image: zilliz/attu:v3.0.1
    environment:
      MILVUS_URL: standalone:19530
    ports:
      - "3001:3000"
    depends_on:
      - standalone

networks:
  default:
    name: medical-milvus3-net
